services:
  postgres:
    image: postgres:16-alpine
    container_name: gdrive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: drive
      POSTGRES_PASSWORD: drive
      POSTGRES_DB: drive
    ports:
      - "5432:5432"
    volumes:
      - gdrive_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drive -d drive"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Simulador da AWS (drop-in do LocalStack). Expõe o S3 em :4566 para o
  # desenvolvimento — o adapter aponta o endpoint pra cá; em produção, S3 real.
  floci:
    image: floci/floci:latest
    container_name: gdrive-floci
    restart: unless-stopped
    environment:
      # Credenciais descartáveis de teste — combinam com o .env.example.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "4566:4566"
    volumes:
      # Necessário para os serviços do floci que sobem containers reais.
      - /var/run/docker.sock:/var/run/docker.sock

  # --- Pipeline de ingestão de documentos (contexto `rag`) ---
  # O worker roteia cada documento para a ferramenta certa pelo seu formato.

  # Apache Tika Server — extrator universal e fallback (centenas de formatos).
  tika:
    image: apache/tika:latest
    container_name: gdrive-tika
    restart: unless-stopped
    ports:
      - "9998:9998"

  # Unstructured API — documentos ricos/semiestruturados (Office, HTML, e-mail).
  unstructured:
    image: downloads.unstructured.io/unstructured-io/unstructured-api:latest
    container_name: gdrive-unstructured
    restart: unless-stopped
    ports:
      - "8000:8000"

  # docling-serve — especialista em PDF (layout, tabelas, ordem de leitura).
  docling:
    image: ghcr.io/docling-project/docling-serve:latest
    container_name: gdrive-docling
    restart: unless-stopped
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
    ports:
      - "5001:5001"

volumes:
  gdrive_pgdata:
