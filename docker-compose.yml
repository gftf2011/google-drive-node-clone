services:
  postgres:
    # pgvector/pgvector é um superset do postgres:16 com a extensão `vector`
    # (usada por rag_chunks). Drop-in: mesmas credenciais, dados e migrations.
    image: pgvector/pgvector:pg16
    container_name: gdrive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: drive
      POSTGRES_PASSWORD: drive
      POSTGRES_DB: drive
    ports:
      - "5432:5432"
    volumes:
      - gdrive_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drive -d drive"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Simulador da AWS (drop-in do LocalStack). Expõe o S3 em :4566 para o
  # desenvolvimento — o adapter aponta o endpoint pra cá; em produção, S3 real.
  floci:
    image: floci/floci:latest
    container_name: gdrive-floci
    restart: unless-stopped
    environment:
      # Credenciais descartáveis de teste — combinam com o .env.example.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "4566:4566"
    volumes:
      # Necessário para os serviços do floci que sobem containers reais.
      - /var/run/docker.sock:/var/run/docker.sock

  # --- Pipeline de ingestão de documentos (contexto `rag`) ---
  # O worker roteia cada documento para a ferramenta certa pelo seu formato.

  # Apache Tika Server — extrator universal e fallback (centenas de formatos).
  tika:
    image: apache/tika:latest
    container_name: gdrive-tika
    restart: unless-stopped
    ports:
      - "9998:9998"

  # --- Serviços PESADOS: só no profile `full` (exigem bastante RAM/disco). ---
  # Em máquinas modestas, rode sem eles (perfil lite): o router cai para o Tika
  # e o enriquecimento é desligado. Ver INGESTION_EXTRACTOR_MODE/ENRICH_ENABLED.

  # Unstructured API — documentos ricos/semiestruturados (Office, HTML, e-mail).
  unstructured:
    image: downloads.unstructured.io/unstructured-io/unstructured-api:latest
    container_name: gdrive-unstructured
    profiles: ["full"]
    restart: unless-stopped
    ports:
      - "8000:8000"

  # docling-serve — especialista em PDF (layout, tabelas, ordem de leitura).
  docling:
    image: ghcr.io/docling-project/docling-serve:latest
    container_name: gdrive-docling
    profiles: ["full"]
    restart: unless-stopped
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
    ports:
      - "5001:5001"

  # Ollama — LLM self-hosted para o enriquecimento (resumo/keywords/perguntas).
  # Sem chave de API. Baixe o modelo uma vez:
  #   docker exec gdrive-ollama ollama pull llama3.1
  # Obs.: no Mac o container não usa GPU; em máquinas modestas prefira o Ollama
  # NATIVO no host e mantenha este serviço fora (perfil lite).
  ollama:
    image: ollama/ollama:latest
    container_name: gdrive-ollama
    profiles: ["full"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - gdrive_ollama:/root/.ollama

volumes:
  gdrive_pgdata:
  gdrive_ollama:
